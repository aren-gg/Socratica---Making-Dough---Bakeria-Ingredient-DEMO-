<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandma's Bakeria · Rush Order Sourcing</title>
<style>
:root{--bg:#fbf5ec;--card:#fff;--ink:#3b2a1e;--mut:#8a7565;--acc:#b5532a;--ok:#2f7d4f;--warn:#b7791f;--bad:#b3392f;--line:#eadfce;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1712;--card:#2a211a;--ink:#f3e8da;--mut:#b5a28f;--acc:#e48a5a;--ok:#6cc08b;--warn:#e0b05a;--bad:#ef7d72;--line:#43362b}}
:root[data-theme="dark"]{--bg:#1e1712;--card:#2a211a;--ink:#f3e8da;--mut:#b5a28f;--acc:#e48a5a;--ok:#6cc08b;--warn:#e0b05a;--bad:#ef7d72;--line:#43362b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
header{padding:20px 20px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:1.6rem}header p{margin:4px 0 0;color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;padding:12px 20px 40px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;margin:4px 4px 0 0}
button.go{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;width:100%;padding:12px;margin-top:10px;font-size:1.05rem}
label{display:block;margin-top:10px;color:var(--mut);font-size:.9rem}
.verdict{font-size:1.4rem;font-weight:bold}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px}.stat b{display:block;font-size:1.2rem}.stat span{color:var(--mut);font-size:.8rem}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tag{font-size:.75rem;padding:1px 7px;border-radius:99px;border:1px solid var(--ok);color:var(--ok)}.tag.d{border-color:var(--warn);color:var(--warn)}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:8px;font:inherit;font-size:.92rem;margin:0}
</style></head><body>
<header><h1>🥧 Grandma's Bakeria · Rush Order Sourcing</h1><p>Paste a short-notice order. Get a yes/no, a local-first buy list and a quote in seconds.</p></header>
<main>
<section>
<div class="card"><h2>Incoming order</h2>
<textarea id="in"></textarea>
<div id="samples"></div>
<label>Local-first strength: <b id="lv">15%</b> price premium accepted for local growers</label>
<input type="range" id="loc" min="0" max="40" value="15" style="width:100%">
<label>Bakers available <input type="number" id="bk" value="2" min="1" max="8" style="width:60px"></label>
<button class="go" id="run">Check feasibility</button></div>
<div class="card"><h2>Local growers</h2><div class="scroll"><table id="sup"></table></div></div>
</section>
<section id="out"><div class="card">Choose a sample order or paste one, then press <b>Check feasibility</b>.</div></section>
</main>
<script>
// ---------- DATA ----------
const R={parfait:{n:'mini parfait',m:1.5,i:{cream:40,yogurt:60,granola:25,apples:50,honey:8,cinnamon:.3}},
donut:{n:'apple cider donut',m:2.5,i:{flour:55,sugar:20,butter:12,eggs:.4,cider:30,cinnamon:.5}},
tart:{n:'pumpkin tart',m:3,i:{pumpkin:60,flour:40,butter:25,eggs:.5,sugar:18,cream:20}}};
const U={cream:'ml',yogurt:'g',granola:'g',apples:'g',honey:'g',cinnamon:'g',flour:'g',sugar:'g',butter:'g',eggs:'ea',cider:'ml',pumpkin:'g'};
// name, local, km, lead hours, minimum $
const S=[['Hillcrest Orchard',1,12,12,30],['Maple Lane Dairy',1,18,24,40],['Sunny Side Eggs',1,9,6,15],['Wellspring Mill',1,30,36,25],['Pumpkin Patch Farm',1,22,18,20],['Metro Foodservice',0,60,6,50]];
// supplier idx, ingredient, pack size, pack price, packs in stock
const O=[[0,'apples',5000,14,40],[0,'cider',4000,16,20],[0,'honey',1000,11,6],[1,'cream',2000,13,15],[1,'yogurt',4000,14,10],[1,'butter',1000,9,12],[2,'eggs',30,9,10],[3,'flour',10000,13,8],[3,'granola',2000,16,4],[4,'pumpkin',3000,10,6],
[5,'apples',5000,11,99],[5,'cider',4000,13,99],[5,'honey',1000,9,99],[5,'cream',2000,10.5,99],[5,'yogurt',4000,11,99],[5,'butter',1000,7.5,99],[5,'eggs',30,7.5,99],[5,'flour',10000,10,99],[5,'granola',2000,13,99],[5,'pumpkin',3000,8,99],[5,'sugar',10000,9,99],[5,'cinnamon',500,8,99]]
.map(([s,i,p,c,k])=>({s,i,p,c,k}));
const SAMPLES={'Easy: 48h':'Hi Grandma, the Student Union needs 120 mini parfaits and 80 apple cider donuts for Friday welcome night. Can you deliver in 48 hours?',
'Tight: 10h':'Urgent! Engineering society event tonight. Need 60 mini parfaits in 10 hours.',
'Too big':'Homecoming committee: 900 pumpkin tarts and 500 mini parfaits needed in 2 days.'};
// ---------- LOGIC (the "backend") ----------
const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parse(t){const s=t.toLowerCase(),items=[];
 for(const k in R){const m=s.match(new RegExp('(\\d+)\\s+(?:\\w+\\s+){0,2}?'+k+'s?'));if(m)items.push({k,q:+m[1]})}
 let h=null,m;
 if(m=s.match(/(\d+)\s*(?:hours?|hrs?|h)\b/))h=+m[1];
 else if(m=s.match(/(\d+)\s*days?/))h=+m[1]*24;
 else if(/tomorrow/.test(s))h=24;
 else{for(let d=0;d<7;d++)if(s.includes(WD[d])){const n=new Date(),t2=new Date(n);let diff=(d-n.getDay()+7)%7||7;t2.setDate(n.getDate()+diff);t2.setHours(14,0,0,0);
  const tm=s.match(/(\d{1,2})\s*(am|pm)/);if(tm){let x=+tm[1]%12+(tm[2]=='pm'?12:0);t2.setHours(x)}h=(t2-n)/36e5;break}}
 return{items,h}}
function plan(items,h,bias,bakers){
 const need={};let mins=0,units=0;
 items.forEach(({k,q})=>{units+=q;mins+=q*R[k].m;for(const i in R[k].i)need[i]=(need[i]||0)+R[k].i[i]*q*1.08});
 const lines=[],short=[];
 for(const i in need){
  const c=O.filter(o=>o.i==i).map(o=>{const sp=S[o.s],packs=Math.ceil(need[i]/o.p);return{...o,sp,packs,cost:packs*o.c,ok:sp[3]<=h&&packs<=o.k,late:sp[3]>h}});
  const feas=c.filter(o=>o.ok);
  if(!feas.length){short.push({i,why:c.every(o=>o.late)?'no supplier can deliver in time':'not enough stock'});continue}
  feas.forEach(o=>o.eff=o.cost*(o.sp[1]?1:1+bias/100));
  feas.sort((a,b)=>a.eff-b.eff);const w=feas[0];
  const loc=feas.find(o=>o.sp[1]);
  lines.push({i,need:need[i],w,alt:feas[1],localLost:!w.sp[1]&&!loc})}
 const bySup={};lines.forEach(l=>{(bySup[l.w.s]??=[]).push(l)});
 const cost=lines.reduce((a,l)=>a+l.w.cost,0),localCost=lines.filter(l=>l.w.sp[1]).reduce((a,l)=>a+l.w.cost,0);
 const baseline=lines.reduce((a,l)=>a+Math.max(...O.filter(o=>o.i==l.i).map(o=>Math.ceil(l.need/o.p)*o.c)),0);
 const labHrs=mins/60,avail=Math.max(0,h-8)*0.45*bakers/1.0;
 const labor=labHrs*18,total=(cost+labor)*1.35;
 return{need,lines,short,bySup,cost,localPct:cost?localCost/cost*100:0,labHrs,avail,labor,total,units,baseline,nonLocal:lines.filter(l=>!l.w.sp[1]).map(l=>l.i)}}
// ---------- UI ----------
const $=id=>document.getElementById(id),f=n=>'$'+n.toFixed(2);
$('in').value=SAMPLES['Easy: 48h'];
$('samples').innerHTML=Object.keys(SAMPLES).map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('samples').onclick=e=>{if(e.target.dataset.k){$('in').value=SAMPLES[e.target.dataset.k];run()}};
$('loc').oninput=()=>$('lv').textContent=$('loc').value+'%';
$('sup').innerHTML='<tr><th>Grower</th><th>Distance</th><th>Lead time</th><th>Min</th></tr>'+S.map(s=>`<tr><td>${s[0]} <span class="tag ${s[1]?'':'d'}">${s[1]?'local':'distributor'}</span></td><td>${s[2]} km</td><td>${s[3]}h</td><td>$${s[4]}</td></tr>`).join('');
function run(){
 const {items,h}=parse($('in').value),out=$('out');
 if(!items.length||h==null){out.innerHTML=`<div class="card bad">I couldn't find ${!items.length?'any items (try "parfait", "donut" or "tart")':'a deadline (try "in 48 hours" or "Friday 2pm")'}. Please rephrase.</div>`;return}
 const p=plan(items,h,+$('loc').value,+$('bk').value);
 let v,cls,why=[];
 if(p.short.length){v='No — cannot source in time';cls='bad';why.push('Missing: '+p.short.map(s=>`${s.i} (${s.why})`).join(', '))}
 if(p.labHrs>p.avail){v='No — not enough baking capacity';cls='bad';why.push(`Needs ${p.labHrs.toFixed(1)} baker-hours, only ~${p.avail.toFixed(1)} available`)}
 if(!v){if(p.nonLocal.length){v='Yes, with some non-local items';cls='warn';why.push('Not available locally in time: '+p.nonLocal.join(', '))}else{v='Yes — fully local';cls='ok'}}
 const under=Object.entries(p.bySup).filter(([s,ls])=>ls.reduce((a,l)=>a+l.w.cost,0)<S[s][4]);
 if(under.length&&cls!='bad')why.push('Below minimum order at: '+under.map(([s])=>S[s][0]).join(', ')+' — add stock items to meet it');
 let alt='';
 if(cls=='bad'){const maxByLab=Math.floor(p.units*p.avail/p.labHrs);alt=`<div class="card"><h2>Counter-offer</h2><p>${p.labHrs>p.avail?`Offer a reduced order of about <b>${Math.max(0,Math.floor(maxByLab/10)*10)} items</b> that Grandma's team can bake in time, or ask for ${Math.ceil(p.labHrs/(p.avail/(h-8||1)*0.45*1)/24+1)||2}+ more days.`:'Ask for a later deadline or swap the unavailable ingredient for a seasonal one (e.g. pumpkin for apples).'}</p></div>`}
 const sup=Object.entries(p.bySup).map(([s,ls])=>`<h2 style="margin-top:14px">${S[s][0]} <span class="tag ${S[s][1]?'':'d'}">${S[s][1]?'local · '+S[s][2]+' km':'distributor'}</span></h2><div class="scroll"><table><tr><th>Item</th><th>Need</th><th>Buy</th><th>Cost</th><th>Why</th></tr>${ls.map(l=>`<tr><td>${l.i}</td><td>${Math.round(l.need)} ${U[l.i]}</td><td>${l.w.packs} × ${l.w.p} ${U[l.i]}</td><td>${f(l.w.cost)}</td><td>${l.w.sp[1]?'local & in time':'only option in time'}${l.alt&&l.alt.s!=l.w.s?` (next: ${S[l.alt.s][0]} ${f(l.alt.cost)})`:''}</td></tr>`).join('')}</table></div>`).join('');
 const dl=items.map(i=>i.q+' '+R[i.k].n+'s').join(' and '),per=p.total/p.units;
 const email=`Subject: Re: Your order for ${dl}\n\nHi there,\n\nThanks for thinking of Grandma's Bakeria! ${cls=='bad'?`Unfortunately we can't fully meet a ${h.toFixed(0)}-hour turnaround for ${dl}. We'd be glad to do a smaller batch or a later date — just let us know what works.`:`We can absolutely do ${dl} within your ${h.toFixed(0)}-hour window, made with ${Math.round(p.localPct)}% locally sourced ingredients.\n\nQuote: ${f(p.total)} total (about ${f(per)} each).`}\n\nWarmly,\nGrandma's Bakeria`;
 out.innerHTML=`<div class="card"><div class="verdict ${cls}">${v}</div><p>${dl} · deadline in ${h.toFixed(0)} hours</p>${why.map(w=>`<p class="${cls}" style="margin:2px 0">• ${w}</p>`).join('')}
 <div class="stats"><div class="stat"><b>${f(p.total)}</b><span>recommended quote</span></div><div class="stat"><b>${f(per)}</b><span>per item</span></div><div class="stat"><b>${Math.round(p.localPct)}%</b><span>spend with local growers</span></div><div class="stat"><b>${f(p.cost)}</b><span>ingredients</span></div><div class="stat"><b>${f(p.baseline-p.cost)}</b><span>saved vs. priciest option</span></div><div class="stat"><b>${p.labHrs.toFixed(1)}h</b><span>baker time</span></div></div></div>${alt}
 <div class="card"><h2>Purchase list (grouped by supplier)</h2>${sup||'<p>Nothing to buy.</p>'}</div>
 <div class="card"><h2>Draft reply</h2><pre id="em">${email}</pre><button onclick="navigator.clipboard&&navigator.clipboard.writeText($('em').textContent)">Copy</button></div>`}
$('run').onclick=run;run();
</script></body></html>
