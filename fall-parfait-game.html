<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandma's Fall Parfait · Guess the Recipe</title>

    <!-- External Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
        /* CSS Variables & Theme Configuration */
        :root {
            --bg: #ffe8c2;
            --bg2: #ffd08a;
            --card: #fff6e3;
            --ink: #4a2c1a;
            --acc: #e0642b;
            --red: #d7263d;
            --grn: #4f9a3c;
            --line: #4a2c1a;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Dark Mode Support */
        @media(prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #3a2214;
                --bg2: #2a170d;
                --card: #5a3720;
                --ink: #ffe8c2;
                --line: #1b0e06;
            }
        }

        :root[data-theme="dark"] {
            --bg: #3a2214;
            --bg2: #2a170d;
            --card: #5a3720;
            --ink: #ffe8c2;
            --line: #1b0e06;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100%;
            background: linear-gradient(var(--bg), var(--bg2));
            color: var(--ink);
            font: 400 11px/1.8 "Press Start 2P", "Courier New", monospace;
            text-align: center;
            overflow-x: hidden;
        }

        /* Pixel Art Rendering Styles */
        .px {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            margin: 0 auto;
        }

        .wrap {
            max-width: 560px;
            margin: auto;
            padding: 14px 14px 40px;
        }

        /* Brand Logo Badge */
        .brand {
            position: absolute;
            top: calc(14px + env(safe-area-inset-top, 0px));
            left: 14px;
            width: 88px;
            height: 88px;
            background: #fff6e3;
            border: 5px solid var(--line);
            box-shadow: 0 0 0 5px var(--acc), 8px 8px 0 5px var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            animation: bob 1.2s steps(2) infinite;
        }

        .brand:hover {
            animation-play-state: paused;
            transform: scale(1.08) rotate(-4deg);
        }

        .brand img {
            width: 84%;
            height: 84%;
            object-fit: contain;
        }

        @keyframes bob {
            50% { transform: translateY(-4px); }
        }

        h1 {
            margin: 6px 0 0;
            font-size: 16px;
            line-height: 1.7;
            color: var(--acc);
            text-shadow: 2px 2px 0 var(--line);
            font-weight: 400;
            letter-spacing: 1px;
            padding: 0 100px;
        }

        @media(max-width: 420px) {
            .brand { width: 64px; height: 64px; left: 12px; }
            h1 { padding: 0 76px; font-size: 13px; }
        }

        /* Hero Image & Badge */
        .hero {
            position: relative;
            margin: 14px auto 8px;
            width: 168px;
        }

        .sale {
            position: absolute;
            top: 0;
            right: -74px;
            background: var(--red);
            color: #fff;
            border: 4px solid var(--line);
            padding: 4px 6px;
            font-size: 8px;
            line-height: 1.4;
            transform: rotate(8deg);
            box-shadow: 4px 4px 0 var(--line);
            animation: wob 2s steps(2) infinite;
        }

        @keyframes wob {
            50% { transform: rotate(4deg); }
        }

        /* Game Container Styles */
        .card {
            background: var(--card);
            border: 4px solid var(--line);
            padding: 12px;
            margin: 12px 0;
            box-shadow: 5px 5px 0 var(--line);
        }

        /* Parfait Cup & Stage */
        .stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            min-height: 290px;
        }

        .cup {
            position: relative;
            width: 190px;
            height: 250px;
            border: 6px solid var(--line);
            border-top: none;
            background: rgba(255, 255, 255, .35);
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            margin: 0 auto;
            box-shadow: 6px 6px 0 var(--line);
            transition: transform .2s steps(3);
        }

        .cup.over {
            transform: scale(1.05);
            background: rgba(255, 255, 255, .7);
        }

        .rim {
            width: 210px;
            height: 16px;
            border: 5px solid var(--line);
            background: var(--card);
            margin: 0 auto -4px;
            position: relative;
            z-index: 2;
            box-shadow: 4px 4px 0 var(--line);
        }

        .stage > div {
            position: relative;
            padding-bottom: 14px;
        }

        .stage > div::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 200px;
            height: 8px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .25);
        }

        /* Ingredient Layers in Cup */
        .layer {
            height: 20%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-top: 4px solid var(--line);
            animation: drop .5s steps(6);
            cursor: pointer;
            position: relative;
            color: #4a2c1a;
        }

        .layer b {
            font-size: 7px;
            line-height: 1.3;
            background: #fffc;
            padding: 2px 4px;
            font-weight: 400;
            max-width: 90px;
        }

        .layer.ok { box-shadow: inset 0 0 0 4px var(--grn); }
        .layer.no { box-shadow: inset 0 0 0 4px var(--red); filter: saturate(.6); }

        @keyframes drop {
            0% { transform: translateY(-260px); opacity: 0; }
            100% { transform: none; opacity: 1; }
        }

        .shake {
            animation: shake .4s steps(4);
        }

        @keyframes shake {
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Basket & Ingredient Selection */
        .basket {
            position: relative;
            margin: 26px 0 8px;
            filter: drop-shadow(5px 5px 0 var(--line));
        }

        #handle {
            display: block;
            width: 72%;
            height: auto;
            margin: 0 auto -4px;
            image-rendering: pixelated;
        }

        .items {
            background: conic-gradient(#ffd6d6 25%, #fff 0 50%, #ffd6d6 0 75%, #fff 0) 0 0/16px 16px;
            border: 6px solid var(--line);
            border-bottom: 0;
            padding: 12px 6px 6px;
        }

        .bank {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .weave {
            height: 58px;
            border: 6px solid var(--line);
            background: conic-gradient(#c78b45 25%, #9a6a30 0 50%, #c78b45 0 75%, #9a6a30 0) 0 0/16px 16px;
        }

        .ing {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            padding: 4px 0 2px;
            transition: transform .1s steps(2);
            color: #4a2c1a;
        }

        .ing:hover { transform: translateY(-4px); }
        .ing:active { cursor: grabbing; }

        .ing span {
            display: inline-block;
            margin-top: 4px;
            font-size: 7px;
            line-height: 1.35;
            background: #fff;
            border: 2px solid var(--line);
            padding: 2px 3px;
        }

        .ghost {
            position: fixed;
            z-index: 99;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: drop-shadow(4px 4px 0 #0005);
        }

        /* Buttons & Feedback */
        button.big {
            font: inherit;
            font-size: 11px;
            color: #fff;
            background: var(--acc);
            border: 4px solid var(--line);
            padding: 12px 14px;
            margin: 8px 4px 0;
            box-shadow: 4px 4px 0 var(--line);
            cursor: pointer;
        }

        button.big:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--line);
        }

        button.alt { background: var(--card); color: var(--ink); }
        button:disabled { opacity: .45; }

        #msg {
            min-height: 5.4em;
            font-size: 10px;
            line-height: 1.8;
            padding: 8px 0 0;
        }

        /* Form Inputs & Coupons */
        input {
            font: inherit;
            font-size: 10px;
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 4px solid var(--line);
            background: #fff;
            color: #4a2c1a;
        }

        .coupon {
            border: 4px dashed var(--red);
            padding: 10px;
            margin-top: 10px;
            background: #fff;
            color: #4a2c1a;
        }

        .coupon big {
            display: block;
            font-size: 14px;
            color: var(--red);
            letter-spacing: 1px;
            margin: 6px 0;
        }

        /* Success Animations */
        .leaf {
            position: fixed;
            top: -50px;
            z-index: 98;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }

        dialog {
            border: 4px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font: inherit;
            max-width: 420px;
            width: 92%;
            box-shadow: 6px 6px 0 var(--line);
        }

        dialog h2 {
            font-size: 12px;
            line-height: 1.6;
            font-weight: 400;
        }

        .stats { font-size: 8px; opacity: .8; }
    </style>
</head>
<body>

    <!-- Header & Logo -->
    <div class="brand" title="Grandma's Bakeria">
        <img src="grandmalogo.png" alt="Grandma's Bakeria logo">
</div>

    <div class="wrap">
        <h1>GRANDMA'S<br>FALL PARFAIT</h1>

        <!-- Hero Section -->
        <div class="hero">
            <img id="heroimg" class="px" alt="Grandma's Fall Parfait">
            <div class="sale">LIMITED WEEKLY SALE!</div>
        </div>

        <!-- Game Instructions -->
        <div class="card">
            <div style="font-size: 10px">
                Grandma's secret weekly recipe has <b id="n">5</b> ingredients.<br>
                Grab them from the basket and drop them in the cup!
            </div>
            <div class="stats" id="st"></div>
        </div>

        <!-- Interactive Parfait Area -->
        <div class="card">
            <div class="stage" id="stage">
                <div>
                    <div class="rim"></div>
                    <div class="cup" id="cup"></div>
                </div>
            </div>

            <div id="msg">Drag ingredients from the basket into the cup (or just tap them)</div>

            <button class="big" id="chk">TASTE IT!</button>
            <button class="big alt" id="clr">EMPTY CUP</button>
        </div>

        <!-- The Basket (Ingredient Palette) -->
        <div class="basket">
            <canvas id="handle" width="40" height="12"></canvas>
            <div class="items">
                <div class="bank" id="bank"></div>
            </div>
            <div class="weave"></div>
        </div>
    </div>

    <!-- Win State Dialog -->
    <dialog id="dlg">
        <div id="win"></div>
    </dialog>
<script>
        /*
           --- Pixel Art System ---
           PAL: Color Palette
           SPR: String representations of pixel grids
        */
        const PAL = {
            k: '#4a2c1a', w: '#ffffff', c: '#fff3cf', y: '#f6c445',
            o: '#e0642b', O: '#f19a2b', b: '#a86a3a', B: '#7a4a30',
            t: '#d9a15b', r: '#d7263d', p: '#f0647a', g: '#4f9a3c',
            n: '#f7e27a', a: '#d58a2f', l: '#ffd24d', h: '#e8884a', d: '#c9a227'
};

        const SPR = {
            yogurt: ["..kkkkkk..",".kwwwwwwk.","kkkkkkkkkk","kcccccccck","kccccrccck","kcccccccck",".kcccccck.","..kcccck..","..kkkkkk.."],
            granola: ["...kk.kk..","..ktbtbtk.",".ktbtttbtk",".kbtttbttk","kttbtbtttk","ktbtttbttk","kkttbtbtkk",".kkkkkkkk."],
            apple: ["....kbgg..","..kkkbkkk.",".khhhhhhhk","khhohhhhhk","khhhhhohhk","khohhhhhhk",".khhhhhhk.","..kkhhkk..","....kk...."],
            pumpkin: ["....kg....",".kkkkkkkk.","kOOkOOkOOk","kOkOOOOkOk","kOkOOOOkOk","kOOkOOkOOk",".kOOOOOOk.","..kkkkkk.."],
            honey: ["..kkkkkk..","..kbbbbk..",".kkkkkkkk.","kyyyyyyyyk","kyywwyyyyk","kyyyyyyyyk","kyyyyyyyyk",".kyyyyyyk.","..kkkkkk.."],
            cream: ["....kk....","...kwwk...","..kwwwwk..","...kwwk...",".kkwwwwkk.","kwwwwwwwwk",".kwwwwwwk.","kwwwwwwwwk","kkkkkkkkkk"],
            pecan: ["..kkkk....",".kbbbbk...","kbBbbbbk..","kbbBbbbbk.",".kbbBbbbk.","..kbbbbk..","...kkkk..."],
            caramel: ["...kaak...","..kaaaak..",".kaaaaaak.","kaaaaaaaak","kkkkkkkkkk","kbbbbbbbbk",".kbbbbbbk.","..kkkkkk.."],
            choc: ["kkkkkkkkkk","kBBkBBkBBk","kBBkBBkBBk","kkkkkkkkkk","kBBkBBkBBk","kBBkBBkBBk","kkkkkkkkkk"],
            banana: [".......kk.","......knk.",".....knnk.","....knnnk.","...knnnnk.",".kknnnnk..","knnnnnkk..",".kkkkk...."],
            berry: ["...gggg...","..kkggkk..",".kppppppk.","kpprpppppk","kppppprppk",".kpprpppk.","..kppppk..","...kppk...","....kk...."],
            cheese: ["......kkk.","...kkkllk.",".kkllllllk","klllldllk.","kllllllllk","kllldlllld","kkkkkkkkkk"],
            parfait: ["......gg......",".....krrk.....","....kkwwkk....","...kwwwwwwk...","..kwwwwwwwwk..",".kwwwwwwwwwwk.",".kkkkkkkkkkkk.",".kcccccccccck.",".koooooooooook.",".kttttttttttk.",".kcccccccccck.",".koooooooooook.","..kccccccccck.","...kcccccck...",".....kwwk.....",".....kwwk.....","...kkkkkkkk..."]
        };
        const cache = {};

        /** Generates an image data URL from the sprite strings **/
        function spr(k) {
            if (cache[k]) return cache[k];
            const rows = SPR[k];
            const isBig = k === 'parfait';
            const width0 = Math.max(...rows.map(r => r.length));
            const width = isBig ? width0 : Math.max(10, width0);
            const height = isBig ? rows.length : Math.max(10, rows.length);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const topOffset = height - rows.length;
            const leftOffset = Math.floor((width - width0) / 2);

            rows.forEach((row, rowIndex) => {
                [...row.padEnd(width0, '.')].forEach((char, colIndex) => {
                    if (PAL[char]) {
                        ctx.fillStyle = PAL[char];
                        ctx.fillRect(colIndex + leftOffset, rowIndex + topOffset, 1, 1);
                    }
                });
            });
            return cache[k] = { u: canvas.toDataURL(), w: width, h: height };
        }

        /** Helper for generating image tags **/
        function imgTag(k, s) {
            const o = spr(k);
            return `<img class="px" alt="" draggable="false" src="${o.u}" style="width:${o.w * s}px;height:${o.h * s}px">`;
        }

        /* --- Initialization --- */

        // Render Hero Image
        (function() {
            const o = spr('parfait');
            const h = document.getElementById('heroimg');
            h.src = o.u;
            h.style.width = o.w * 12 + 'px';
            h.style.height = o.h * 12 + 'px';
        })();

        // Render Basket Handle
        (function() {
            const c = document.getElementById('handle'),
                  x = c.getContext('2d'),
                  inn = (px, py, rx, ry) => ((px + .5 - 20) / rx) ** 2 + ((py + .5 - 12) / ry) ** 2 <= 1;
            for (let py = 0; py < 12; py++) {
                for (let px = 0; px < 40; px++) {
                    if (!inn(px, py, 20, 12) || inn(px, py, 16, 8)) continue;
                    const edge = !inn(px, py, 19, 11) || inn(px, py, 17, 9);
                    x.fillStyle = edge ? '#4a2c1a' : (px % 2 ? '#b9803f' : '#8a5a2b');
                    x.fillRect(px, py, 1, 1);
                }
            }
        })();

        /* --- Game Logic --- */

        const ING = {
            yogurt: ['Vanilla Yogurt', '#fff3cf'],
            granola: ['Granola', '#d9a15b'],
            apple: ['Roasted Apples', '#e8884a'],
            pumpkin: ['Pumpkin Spice', '#f19a2b'],
            honey: ['Honey', '#f6c445'],
            cream: ['Whipped Cream', '#ffffff'],
            pecan: ['Pecans', '#a86a3a'],
            caramel: ['Caramel', '#d58a2f'],
            choc: ['Chocolate', '#9a6244'],
            banana: ['Banana', '#f7e27a'],
            berry: ['Strawberry', '#f0647a'],
            cheese: ['Cheese?!', '#ffd24d']
        };

        // Rotation of secrets based on the week
        const WEEKLY = [
            ['yogurt', 'granola', 'apple', 'pumpkin', 'honey'],
            ['cream', 'pecan', 'caramel', 'apple', 'granola'],
            ['yogurt', 'pumpkin', 'pecan', 'honey', 'cream']
        ];

        const weekIndex = Math.floor(Date.now() / 6048e5);
        const secret = WEEKLY[weekIndex % WEEKLY.length];
        const MAX = 5;

        let cup = [];
        let marks = [];
        let tries = 0;
        let locked = false;
        let sound = true;

        const $ = id => document.getElementById(id);

        $('n').textContent = secret.length;
        $('bank').innerHTML = Object.entries(ING).map(([k, v]) =>
            `<div class="ing" data-k="${k}">${imgTag(k, 4)}<span>${v[0]}</span></div>`
        ).join('');

        /** Sound Effects **/
        function blip(freq = 440, duration = .12) {
            if (!sound) return;
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.value = freq;
                osc.type = 'square';
                gain.gain.value = .08;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        /** Success Effect: Falling Leaves **/
        function leaves(count = 40) {
            const types = ['apple', 'pumpkin', 'pecan', 'honey'];
            for (let i = 0; i < count; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.innerHTML = imgTag(types[i % 4], 3);
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = 2 + Math.random() * 2.5 + 's';
                leaf.style.animationDelay = Math.random() * .8 + 's';
                document.body.appendChild(leaf);
                setTimeout(() => leaf.remove(), 5500);
            }
        }

        /** UI Refresh **/
        function draw() {
            const cupEl = $('cup');
            cupEl.innerHTML = cup.map((key, index) =>
                `<div class="layer ${marks[index] || ''}" data-i="${index}" style="background:${ING[key][1]}">
                    ${imgTag(key, 3)}<b>${ING[key][0]}</b>
                </div>`
            ).join('');
            $('st').textContent = tries ? `Tries this round: ${tries}` : '';
        }

        /** Add ingredient to cup **/
        function add(key) {
            if (locked) return;
            if (cup.includes(key)) {
                msg('Already in the cup!');
                shake();
                return;
            }
            if (cup.length >= MAX) {
                msg(`Cup is full (${MAX})! Tap a layer to remove it.`);
                shake();
                return;
            }
            cup.push(key);
            marks = [];
draw();
            blip(300 + cup.length * 90);
            msg(ING[key][0] + ' plopped in!');
        }

        function msg(text) { $('msg').textContent = text; }

        function shake() {
            const cupEl = $('cup');
            cupEl.classList.remove('shake');
            void cupEl.offsetWidth; // Reflow
            cupEl.classList.add('shake');
            blip(150, .2);
        }

        /* --- Input Handlers --- */

        // Tap to remove
        $('cup').onclick = e => {
            const layer = e.target.closest('.layer');
            if (layer && !locked) {
                cup.splice(+layer.dataset.i, 1);
                marks = [];
                draw();
                blip(200);
            }
        };

        // Reset
        $('clr').onclick = () => {
            cup = [];
            marks = [];
            draw();
            msg('Fresh cup!');
        };

        // Drag and Drop Logic
        let ghost = null, startX = 0, startY = 0, hasMoved = false;

        document.addEventListener('pointerdown', e => {
            const item = e.target.closest('.ing');
            if (!item) return;
            e.preventDefault();
            startX = e.clientX;
            startY = e.clientY;
            hasMoved = false;

            ghost = document.createElement('div');
            ghost.className = 'ghost';
            ghost.innerHTML = imgTag(item.dataset.k, 5);
            ghost.dataset.k = item.dataset.k;
            document.body.appendChild(ghost);
            updateGhostPosition(e);
        });

        function updateGhostPosition(e) {
            if (!ghost) return;
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) hasMoved = true;
            ghost.style.left = e.clientX + 'px';
            ghost.style.top = e.clientY + 'px';

            const rect = $('cup').getBoundingClientRect();
            const isOver = e.clientX > rect.left - 20 && e.clientX < rect.right + 20 &&
                           e.clientY > rect.top - 60 && e.clientY < rect.bottom + 20;
            $('cup').classList.toggle('over', isOver);
        }

        document.addEventListener('pointermove', updateGhostPosition);

        document.addEventListener('pointerup', e => {
            if (!ghost) return;
            const isOver = $('cup').classList.contains('over');
            $('cup').classList.remove('over');
            const key = ghost.dataset.k;
            ghost.remove();
            ghost = null;
            if (isOver || !hasMoved) add(key);
        });

        document.addEventListener('pointercancel', () => {
            if (!ghost) return;
            $('cup').classList.remove('over');
            ghost.remove();
            ghost = null;
        });

        /** Check Recipe (Taste Test) **/
        $('chk').onclick = () => {
            if (locked) return;
            if (cup.length < secret.length) {
                msg(`Grandma uses ${secret.length} ingredients - add more!`);
                shake();
                return;
            }

            tries++;
            marks = cup.map(key => secret.includes(key) ? 'ok' : 'no');
            const correctCount = marks.filter(m => m == 'ok').length;
            draw();

            if (correctCount == secret.length && cup.length == secret.length) {
                // Winning state
                locked = true;
                blip(660, .3);
                setTimeout(() => blip(880, .4), 150);
                leaves();
                setTimeout(showWinnerDialog, 900);
            } else {
                msg(`${correctCount} of ${secret.length} are right! Green = in Grandma's recipe, red = not. Tap red layers to swap them.`);
                blip(250, .25);
            }
        };

        /** End Game UI **/
        function showWinnerDialog() {
            const couponCode = 'GOLD-' + Math.random().toString(36).slice(2, 6).toUpperCase();
            const prizeText = tries <= 2 ? 'FREE Fall Parfait!' :
                              tries <= 4 ? 'FREE coffee with any parfait' : '15% off your parfait';

            $('win').innerHTML = `
                <div style="margin-bottom:6px">${imgTag('parfait', 5)}</div>
                <h2 style="margin:0">You cracked it in ${tries} ${tries == 1 ? 'try' : 'tries'}!</h2>
                <div class="coupon">
                    You won:<big>${prizeText}</big>Code: <b>${couponCode}</b>
                </div>
                <p style="margin:10px 0 0;font-size:9px">Join Grandma's Loyalty Club to save your prize:</p>
                <input id="nm" placeholder="Your first name">
                <input id="em" type="email" placeholder="Email">
                <button class="big" id="sv">SAVE MY PRIZE</button>
                <button class="big alt" id="ag">PLAY AGAIN</button>
            `;

            $('dlg').showModal();

            $('sv').onclick = () => {
                const email = $('em').value.trim();
                if (!/\S+@\S+\.\S+/.test(email)) {
                    $('em').style.borderColor = '#d7263d';
                    return;
                }
                try {
                    const members = JSON.parse(localStorage.getItem('gb_members') || '[]');
                    members.push({
                        name: $('nm').value,
                        email,
                        code: couponCode,
                        prize: prizeText,
                        tries,
                        week: weekIndex
                    });
                    localStorage.setItem('gb_members', JSON.stringify(members));
                } catch (e) {}
                $('sv').textContent = 'SAVED! SEE YOU AT THE BAKERY';
                $('sv').disabled = true;
            };

            $('ag').onclick = () => {
                $('dlg').close();
                cup = [];
                marks = [];
                tries = 0;
                locked = false;
                draw();
                msg('New round! Same secret recipe this week');
            };
        }

        // Initial Draw
        draw();
    </script>
</body>
</html>
